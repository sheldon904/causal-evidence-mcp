[project]
name = "causal-evidence-mcp"
version = "0.1.0"
description = "DoWhy / PyMC / EconML causal-inference engines exposed as FastAPI endpoints and MCP tools."
requires-python = ">=3.12"
authors = [{ name = "Bay West Labs" }]
readme = "README.md"

dependencies = [
    # HTTP layer
    "fastapi>=0.133,<0.134",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<0.28",

    # Causal inference
    # DoWhy 0.11 released 2024-09 with Python 3.12 support and the refute_estimate
    # methods we use. Pin a range to catch breaking API changes on upgrade.
    "dowhy>=0.11.1,<0.13",
    # PyMC 5 is the maintained major; NUTS + ArviZ summary are stable there.
    "pymc>=5.16,<6",
    "arviz>=0.19,<0.22",
    # EconML provides the CausalForestDML estimator we use for HTE.
    "econml>=0.15,<0.16",
    # NOTEARS reference implementation + causal-learn's PC algorithm for DAG inference.
    "causal-learn>=0.1.4,<0.2",

    # Numerics
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",

    # LLM narrative translator (only endpoint that calls out; others are offline)
    "anthropic>=0.40,<0.50",

    # MCP server — exposes the 6 causal endpoints as MCP tools so a calling
    # agent can use them alongside its native tools. `[cli]` brings in the
    # dev CLI + SSE transport support.
    "mcp[cli]>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
    "httpx>=0.27,<0.28",
    "respx>=0.21,<0.23",
    "ruff>=0.6,<0.13",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line-length handled separately

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
override-dependencies = [
  "shap>=0.46.0",
]
